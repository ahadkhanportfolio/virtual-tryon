<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Virtual Try-On Stylist</title>
    <!-- Tailwind CSS for UI Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js for Lightweight Reactive UI State -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between max-w-md mx-auto shadow-2xl bg-slate-900 border-x border-slate-800"
      x-data="tryOnApp()">

    <!-- Header Section -->
    <header class="p-4 border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50 flex items-center justify-between">
        <div class="flex items-center space-x-2 space-x-reverse">
            <div class="p-2 bg-indigo-600 rounded-xl text-white">
                <i data-lucide="shirt" class="w-6 h-6"></i>
            </div>
            <div>
                <h1 class="font-bold text-lg text-slate-100">AI Stylist</h1>
                <p class="text-xs text-slate-400">Virtual Try-On Assistant</p>
            </div>
        </div>
        <button @click="openSettings = !openSettings" class="p-2 rounded-lg bg-slate-800 text-slate-300 hover:bg-slate-700 transition">
            <i data-lucide="settings" class="w-5 h-5"></i>
        </button>
    </header>

    <!-- Settings Modal for API Key -->
    <div x-show="openSettings" x-cloak class="p-4 bg-slate-800 border-b border-slate-700 transition-all">
        <label class="block text-xs font-semibold text-slate-300 mb-1">Replicate API Token:</label>
        <div class="flex gap-2">
            <input type="password" x-model="apiKey" placeholder="r8_..." class="flex-1 px-3 py-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
            <button @click="saveApiKey()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-lg text-sm font-medium transition">Save</button>
        </div>
        <p class="text-[10px] text-slate-400 mt-1">replicate.com থেকে আপনার API Key সংগ্রহ করুন। এটি ব্রাউজারে সুরক্ষিত থাকবে।</p>
    </div>

    <!-- Main Content Area -->
    <main class="p-4 flex-1 space-y-6 overflow-y-auto">

        <!-- Step 1: Upload User Photo -->
        <div class="space-y-2">
            <label class="block text-sm font-medium text-slate-300 flex items-center justify-between">
                <span>১. আপনার ছবি (Person Image)</span>
                <span class="text-xs text-slate-500">*ফুল বা হাফ বডি ছবি</span>
            </label>
            <div class="relative border-2 border-dashed border-slate-700 hover:border-indigo-500 rounded-2xl p-4 transition text-center bg-slate-800/40">
                <template x-if="!personImgSrc">
                    <label class="cursor-pointer flex flex-col items-center justify-center py-4">
                        <i data-lucide="user-plus" class="w-8 h-8 text-indigo-400 mb-2"></i>
                        <span class="text-sm text-slate-400">আপনার ছবি সিলেক্ট করুন</span>
                        <input type="file" accept="image/*" class="hidden" @change="handleImageUpload($event, 'person')">
                    </label>
                </template>
                <template x-if="personImgSrc">
                    <div class="relative group">
                        <img :src="personImgSrc" class="w-full h-48 object-cover rounded-xl shadow-md">
                        <button @click="personImgSrc = null" class="absolute top-2 right-2 p-1 bg-red-600/80 rounded-full text-white hover:bg-red-600">
                            <i data-lucide="x" class="w-4 h-4"></i>
                        </button>
                    </div>
                </template>
            </div>
        </div>

        <!-- Step 2: Upload Garment Photo -->
        <div class="space-y-2">
            <label class="block text-sm font-medium text-slate-300 flex items-center justify-between">
                <span>২. পোশাকের ছবি (Garment Image)</span>
                <span class="text-xs text-slate-500">*যে পোশাকটি পরতে চান</span>
            </label>
            <div class="relative border-2 border-dashed border-slate-700 hover:border-indigo-500 rounded-2xl p-4 transition text-center bg-slate-800/40">
                <template x-if="!garmentImgSrc">
                    <label class="cursor-pointer flex flex-col items-center justify-center py-4">
                        <i data-lucide="sparkles" class="w-8 h-8 text-indigo-400 mb-2"></i>
                        <span class="text-sm text-slate-400">পোশাকের ছবি সিলেক্ট করুন</span>
                        <input type="file" accept="image/*" class="hidden" @change="handleImageUpload($event, 'garment')">
                    </label>
                </template>
                <template x-if="garmentImgSrc">
                    <div class="relative group">
                        <img :src="garmentImgSrc" class="w-full h-48 object-cover rounded-xl shadow-md">
                        <button @click="garmentImgSrc = null" class="absolute top-2 right-2 p-1 bg-red-600/80 rounded-full text-white hover:bg-red-600">
                            <i data-lucide="x" class="w-4 h-4"></i>
                        </button>
                    </div>
                </template>
            </div>
        </div>

        <!-- Category Selector -->
        <div class="space-y-2">
            <label class="block text-sm font-medium text-slate-300">পোশাকের ক্যাটাগরি</label>
            <div class="grid grid-cols-3 gap-2">
                <button @click="category = 'upper_body'" :class="category === 'upper_body' ? 'bg-indigo-600 text-white border-indigo-500' : 'bg-slate-800 text-slate-400 border-slate-700'" class="py-2.5 px-3 rounded-xl border text-xs font-medium transition">টপস/শার্ট</button>
                <button @click="category = 'lower_body'" :class="category === 'lower_body' ? 'bg-indigo-600 text-white border-indigo-500' : 'bg-slate-800 text-slate-400 border-slate-700'" class="py-2.5 px-3 rounded-xl border text-xs font-medium transition">প্যান্ট/বটমস</button>
                <button @click="category = 'dresses'" :class="category === 'dresses' ? 'bg-indigo-600 text-white border-indigo-500' : 'bg-slate-800 text-slate-400 border-slate-700'" class="py-2.5 px-3 rounded-xl border text-xs font-medium transition">ফুল ড্রেস</button>
            </div>
        </div>

        <!-- Result / Output Display Section -->
        <div x-show="resultImgSrc || isLoading" class="space-y-2 pt-2">
            <label class="block text-sm font-semibold text-indigo-400">AI জেনারেটেড রেজাল্ট</label>
            <div class="relative bg-slate-800 border border-slate-700 rounded-2xl p-2 flex items-center justify-center min-h-[250px]">
                
                <!-- Loading State -->
                <div x-show="isLoading" class="flex flex-col items-center justify-center p-6 space-y-3">
                    <div class="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
                    <p class="text-sm text-slate-300 font-medium animate-pulse">AI আপনার পোশাক ফিটিং করছে...</p>
                    <p class="text-xs text-slate-500">সাধারণত ১০-২০ সেকেন্ড সময় লাগে</p>
                </div>

                <!-- Generated Image -->
                <template x-if="resultImgSrc && !isLoading">
                    <div class="space-y-3 w-full">
                        <img :src="resultImgSrc" class="w-full h-80 object-cover rounded-xl shadow-lg">
                        <a :href="resultImgSrc" download="ai-outfit.jpg" target="_blank" class="w-full py-2.5 bg-slate-700 hover:bg-slate-600 rounded-xl text-xs font-medium flex items-center justify-center space-x-2 space-x-reverse transition">
                            <i data-lucide="download" class="w-4 h-4"></i>
                            <span>ছবি ডাউনলোড করুন</span>
                        </a>
                    </div>
                </template>
            </div>
        </div>

    </main>

    <!-- Bottom Action Button Container -->
    <div class="p-4 bg-slate-900/90 border-t border-slate-800 sticky bottom-0 z-50">
        <button @click="generateOutfit()" :disabled="isLoading || !personImgSrc || !garmentImgSrc"
                class="w-full py-3.5 px-4 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 disabled:opacity-50 text-white rounded-xl font-medium shadow-lg flex items-center justify-center space-x-2 space-x-reverse transition">
            <i data-lucide="wand-2" class="w-5 h-5"></i>
            <span>আউটফিট জেনারেট করুন</span>
        </button>
    </div>

    <!-- Application Logic Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });

        function tryOnApp() {
            return {
                apiKey: localStorage.getItem('replicate_api_key') || '',
                openSettings: false,
                personImgSrc: null,
                garmentImgSrc: null,
                personFile: null,
                garmentFile: null,
                category: 'upper_body',
                isLoading: false,
                resultImgSrc: null,

                saveApiKey() {
                    localStorage.setItem('replicate_api_key', this.apiKey);
                    this.openSettings = false;
                    alert('API Key সফলভাবে সেভ করা হয়েছে!');
                },

                handleImageUpload(event, type) {
                    const file = event.target.files[0];
                    if (!file) return;

                    const reader = new FileReader();
                    reader.onload = (e) => {
                        if (type === 'person') {
                            this.personImgSrc = e.target.result;
                            this.personFile = file;
                        } else {
                            this.garmentImgSrc = e.target.result;
                            this.garmentFile = file;
                        }
                    };
                    reader.readAsDataURL(file);
                },

                async generateOutfit() {
                    if (!this.apiKey) {
                        this.openSettings = true;
                        alert('দয়া করে প্রথমে আপনার Replicate API Key প্রদান করুন।');
                        return;
                    }

                    this.isLoading = true;
                    this.resultImgSrc = null;

                    try {
                        // 1. Upload files to temporary cloud or convert to base64
                        const personBase64 = this.personImgSrc;
                        const garmentBase64 = this.garmentImgSrc;

                        // 2. Call Replicate IDM-VTON API
                        const response = await fetch("https://api.replicate.com/v1/predictions", {
                            method: "POST",
                            headers: {
                                "Authorization": `Bearer ${this.apiKey}`,
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                version: "c87eec4a51a6e88002cead08266023cb22201d44c9f187a5089f3680e6e7368d",
                                input: {
                                    human_img: personBase64,
                                    garm_img: garmentBase64,
                                    category: this.category,
                                    crop: false,
                                    steps: 30
                                }
                            })
                        });

                        const data = await response.json();

                        if (data.error) {
                            throw new Error(data.error);
                        }

                        // Poll the prediction result
                        this.pollPrediction(data.urls.get);

                    } catch (err) {
                        alert("ত্রুটি ঘটেছে: " + err.message);
                        this.isLoading = false;
                    }
                },

                async pollPrediction(getUrl) {
                    const interval = setInterval(async () => {
                        try {
                            const res = await fetch(getUrl, {
                                headers: {
                                    "Authorization": `Bearer ${this.apiKey}`
                                }
                            });
                            const result = await res.json();

                            if (result.status === "succeeded") {
                                clearInterval(interval);
                                this.resultImgSrc = Array.isArray(result.output) ? result.output[0] : result.output;
                                this.isLoading = false;
                            } else if (result.status === "failed") {
                                clearInterval(interval);
                                alert("AI প্রসেসিং ব্যর্থ হয়েছে। আবার চেষ্টা করুন।");
                                this.isLoading = false;
                            }
                        } catch (e) {
                            clearInterval(interval);
                            this.isLoading = false;
                        }
                    }, 3000);
                }
            }
        }
    </script>
</body>
</html>
