<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Virtual Try-On Stylist</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap');
    body { font-family: 'Hind Siliguri', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-start p-4 sm:p-6">

  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-5 sm:p-6 shadow-2xl relative">
    
    <div class="flex items-center justify-between border-b border-slate-800 pb-4 mb-5">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 bg-indigo-600 rounded-2xl flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
          <i class="fa-solid fa-shirt text-lg"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold text-white tracking-wide">AI Stylist</h1>
          <p class="text-xs text-slate-400">Virtual Try-On Assistant</p>
        </div>
      </div>
      <button id="toggleSettings" class="w-10 h-10 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl flex items-center justify-center transition-all duration-200">
        <i class="fa-solid fa-gear text-lg"></i>
      </button>
    </div>

    <div id="settingsPanel" class="hidden mb-6 bg-slate-950/70 border border-slate-800 p-4 rounded-2xl space-y-3">
      <label class="block text-xs font-medium text-slate-300">Replicate API Token:</label>
      <div class="flex space-x-2">
        <input type="password" id="apiTokenInput" placeholder="r8_..." class="flex-1 bg-slate-900 border border-slate-700 text-slate-100 text-sm rounded-xl px-3 py-2.5 focus:outline-none focus:border-indigo-500 transition-all" />
        <button id="saveTokenBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm px-4 py-2.5 rounded-xl transition-all shadow-md">Save</button>
      </div>
    </div>

    <div class="space-y-2 mb-5">
      <div class="flex justify-between items-center text-sm font-semibold text-slate-200">
        <span>১. আপনার ছবি (Person Image)</span>
        <span class="text-[10px] text-indigo-400 font-normal">*ফুল বা হাফ বডি ছবি</span>
      </div>
      <div id="personBox" class="border-2 border-dashed border-slate-800 hover:border-indigo-500/50 bg-slate-950/50 rounded-2xl p-4 text-center cursor-pointer transition-all relative group overflow-hidden min-h-[160px] flex flex-col items-center justify-center">
        <input type="file" id="personInput" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer z-10" />
        <div id="personPlaceholder" class="space-y-2">
          <i class="fa-solid fa-user-tie text-3xl text-slate-600 group-hover:text-indigo-400 transition-colors"></i>
          <p class="text-xs text-slate-400">ছবি সিলেক্ট করতে এখানে ট্যাপ করুন</p>
        </div>
        <img id="personPreview" class="hidden w-full h-44 object-contain rounded-xl" />
      </div>
    </div>

    <div class="space-y-2 mb-5">
      <div class="flex justify-between items-center text-sm font-semibold text-slate-200">
        <span>২. পোশাকের ছবি (Garment Image)</span>
        <span class="text-[10px] text-indigo-400 font-normal">*যে পোশাকটি পরতে চান</span>
      </div>
      <div id="garmentBox" class="border-2 border-dashed border-slate-800 hover:border-indigo-500/50 bg-slate-950/50 rounded-2xl p-4 text-center cursor-pointer transition-all relative group overflow-hidden min-h-[160px] flex flex-col items-center justify-center">
        <input type="file" id="garmentInput" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer z-10" />
        <div id="garmentPlaceholder" class="space-y-2">
          <i class="fa-solid fa-vest-patches text-3xl text-slate-600 group-hover:text-indigo-400 transition-colors"></i>
          <p class="text-xs text-slate-400">পোশাকের ছবি সিলেক্ট করুন</p>
        </div>
        <img id="garmentPreview" class="hidden w-full h-44 object-contain rounded-xl" />
      </div>
    </div>

    <div class="space-y-2 mb-6">
      <label class="block text-xs font-semibold text-slate-300">পোশাকের ক্যাটাগরি</label>
      <div class="grid grid-cols-3 gap-2">
        <button type="button" class="category-btn active bg-indigo-600 border border-indigo-500 text-white text-xs py-2 rounded-xl font-medium transition-all" data-category="upper_body">টপস/শার্ট</button>
        <button type="button" class="category-btn bg-slate-950 border border-slate-800 text-slate-400 text-xs py-2 rounded-xl font-medium transition-all hover:bg-slate-800" data-category="lower_body">প্যান্ট/বটমস</button>
        <button type="button" class="category-btn bg-slate-950 border border-slate-800 text-slate-400 text-xs py-2 rounded-xl font-medium transition-all hover:bg-slate-800" data-category="dresses">ফুল ড্রেস</button>
      </div>
    </div>

    <button id="generateBtn" class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-semibold py-3.5 px-4 rounded-2xl shadow-lg shadow-indigo-600/30 flex items-center justify-center space-x-2 transition-all active:scale-[0.98]">
      <i class="fa-solid fa-wand-magic-sparkles"></i>
      <span>আউটফিট জেনারেট করুন</span>
    </button>

    <div id="resultSection" class="hidden mt-6 space-y-3">
      <p class="text-xs font-semibold text-slate-300">AI জেনারেটেড রেজাল্ট</p>
      
      <div id="loadingBox" class="bg-slate-950/70 border border-slate-800 rounded-2xl p-8 flex flex-col items-center justify-center space-y-3">
        <div class="w-10 h-10 border-4 border-indigo-500/30 border-t-indigo-500 rounded-full animate-spin"></div>
        <p class="text-xs text-slate-300 font-medium animate-pulse">AI আপনার পোশাক ফিটিং করছে...</p>
        <p class="text-[10px] text-slate-500">সাধারণত ২০-৩০ সেকেন্ড সময় লাগে</p>
      </div>

      <div id="resultBox" class="hidden relative group overflow-hidden rounded-2xl border border-slate-800 bg-slate-950">
        <img id="resultImage" class="w-full h-auto object-cover rounded-2xl" />
        <a id="downloadLink" href="#" download="tryon-result.png" class="absolute bottom-3 right-3 bg-slate-900/80 hover:bg-slate-900 text-white text-xs px-3 py-2 rounded-xl backdrop-blur-md border border-slate-700 flex items-center space-x-1.5 transition-all">
          <i class="fa-solid fa-download"></i>
          <span>ডাউনলোড</span>
        </a>
      </div>
    </div>

  </div>

  <script>
    const DEFAULT_API_KEY = "r8_5oXjvSypArOGhfO3tye8LC5hFfdoElQ3QBi26";
    const TOKEN_KEY = 'replicate_api_token';

    const toggleSettings = document.getElementById('toggleSettings');
    const settingsPanel = document.getElementById('settingsPanel');
    const apiTokenInput = document.getElementById('apiTokenInput');
    const saveTokenBtn = document.getElementById('saveTokenBtn');

    const personInput = document.getElementById('personInput');
    const personPreview = document.getElementById('personPreview');
    const personPlaceholder = document.getElementById('personPlaceholder');

    const garmentInput = document.getElementById('garmentInput');
    const garmentPreview = document.getElementById('garmentPreview');
    const garmentPlaceholder = document.getElementById('garmentPlaceholder');

    const categoryBtns = document.querySelectorAll('.category-btn');
    const generateBtn = document.getElementById('generateBtn');

    const resultSection = document.getElementById('resultSection');
    const loadingBox = document.getElementById('loadingBox');
    const resultBox = document.getElementById('resultBox');
    const resultImage = document.getElementById('resultImage');
    const downloadLink = document.getElementById('downloadLink');

    let selectedCategory = 'upper_body';

    // Auto set API key if not saved
    if (!localStorage.getItem(TOKEN_KEY)) {
      localStorage.setItem(TOKEN_KEY, DEFAULT_API_KEY);
    }
    apiTokenInput.value = localStorage.getItem(TOKEN_KEY);

    toggleSettings.addEventListener('click', () => {
      settingsPanel.classList.toggle('hidden');
    });

    saveTokenBtn.addEventListener('click', () => {
      const token = apiTokenInput.value.trim();
      if (!token) return alert('API Key প্রদান করুন');
      localStorage.setItem(TOKEN_KEY, token);
      alert('Key Saved!');
      settingsPanel.classList.add('hidden');
    });

    function setupPreview(input, preview, placeholder) {
      input.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            preview.src = event.target.result;
            preview.classList.remove('hidden');
            placeholder.classList.add('hidden');
          };
          reader.readAsDataURL(file);
        }
      });
    }

    setupPreview(personInput, personPreview, personPlaceholder);
    setupPreview(garmentInput, garmentPreview, garmentPlaceholder);

    categoryBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        categoryBtns.forEach(b => {
          b.classList.remove('bg-indigo-600', 'border-indigo-500', 'text-white');
          b.classList.add('bg-slate-950', 'border-slate-800', 'text-slate-400');
        });
        btn.classList.remove('bg-slate-950', 'border-slate-800', 'text-slate-400');
        btn.classList.add('bg-indigo-600', 'border-indigo-500', 'text-white');
        selectedCategory = btn.dataset.category;
      });
    });

    function fileToDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // Reliable proxy fetch call
    async function makeProxyRequest(url, method, token, bodyData = null) {
      const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
      const headers = {
        'Authorization': `Token ${token}`,
        'Content-Type': 'application/json'
      };

      const options = { method, headers };
      if (bodyData) options.body = JSON.stringify(bodyData);

      const res = await fetch(proxyUrl, options);
      if (!res.ok) {
        const errText = await res.text();
        throw new Error(`Server status ${res.status}: ${errText}`);
      }
      return await res.json();
    }

    generateBtn.addEventListener('click', async () => {
      const token = localStorage.getItem(TOKEN_KEY) || DEFAULT_API_KEY;
      const personFile = personInput.files[0];
      const garmentFile = garmentInput.files[0];

      if (!personFile || !garmentFile) {
        alert('ছবি ২টি সিলেক্ট করুন!');
        return;
      }

      resultSection.classList.remove('hidden');
      loadingBox.classList.remove('hidden');
      resultBox.classList.add('hidden');
      generateBtn.disabled = true;

      try {
        const personBase64 = await fileToDataURL(personFile);
        const garmentBase64 = await fileToDataURL(garmentFile);

        const createPredictionUrl = 'https://api.replicate.com/v1/predictions';
        const payload = {
          version: "c87d920b266dbb70e7d08f6417a258a13009c8a634a7d3914169d427b0b0537e",
          input: {
            human_img: personBase64,
            garm_img: garmentBase64,
            garment_des: selectedCategory,
            is_checked: true,
            is_checked_crop: false,
            denoise_steps: 30,
            seed: 42
          }
        };

        let prediction = await makeProxyRequest(createPredictionUrl, 'POST', token, payload);

        // Poll prediction status
        while (prediction.status !== 'succeeded' && prediction.status !== 'failed') {
          await new Promise(r => setTimeout(r, 3000));
          prediction = await makeProxyRequest(prediction.urls.get, 'GET', token);
        }

        if (prediction.status === 'succeeded' && prediction.output) {
          const outputUrl = Array.isArray(prediction.output) ? prediction.output[0] : prediction.output;
          resultImage.src = outputUrl;
          downloadLink.href = outputUrl;

          loadingBox.classList.add('hidden');
          resultBox.classList.remove('hidden');
        } else {
          throw new Error(prediction.error || 'AI Failed to process image.');
        }

      } catch (err) {
        console.error(err);
        alert('Error: ' + err.message);
        resultSection.classList.add('hidden');
      } finally {
        generateBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
